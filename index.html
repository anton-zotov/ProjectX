<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProjectX</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="admin">
      <button id="admin-toggle" type="button" title="Настройки">⚙</button>
      <div id="admin-panel" class="hidden">
        <div class="admin-title">админка</div>

        <label class="row">
          <span>схема скелета</span>
          <select id="s-scheme"></select>
        </label>

        <button id="open-editor" class="wide" type="button">редактор скелета</button>

        <label class="row">
          <span>тяга (ускорение)</span>
          <input id="s-thrust" type="range" min="300" max="6000" step="100" value="1900" />
          <output id="o-thrust">1900</output>
        </label>

        <label class="row">
          <span>упругость связей, %</span>
          <input id="s-elastic" type="range" min="0.5" max="3" step="0.1" value="1" />
          <output id="o-elastic">100 %</output>
        </label>

        <label class="row">
          <span>сцепление суставов, %</span>
          <input id="s-grip" type="range" min="0" max="1" step="0.05" value="0.25" />
          <output id="o-grip">25 %</output>
        </label>

        <label class="row">
          <span>гравитация</span>
          <input id="s-gravity" type="range" min="0" max="600" step="10" value="180" />
          <output id="o-gravity">180</output>
        </label>

        <label class="row check">
          <input id="s-auto" type="checkbox" />
          <span>авто-пилот (демо)</span>
        </label>

        <label class="row">
          <span>скорость цвета</span>
          <input id="s-color" type="range" min="0" max="5" step="0.1" value="1" />
          <output id="o-color">1.0</output>
        </label>

        <label class="row">
          <span>размер поля, экраны</span>
          <input id="s-size" type="range" min="2" max="6" step="0.5" value="3" />
          <output id="o-size">3 × 2</output>
        </label>

        <label class="row">
          <span>размер тела, %</span>
          <input id="s-body" type="range" min="0.5" max="1.1" step="0.01" value="0.85" />
          <output id="o-body">85 %</output>
        </label>

        <label class="row">
          <span>размер ячейки фона</span>
          <input id="s-cell" type="range" min="50" max="300" step="5" value="120" />
          <output id="o-cell">120</output>
        </label>

        <label class="row check">
          <input id="s-tuning" type="checkbox" checked />
          <span>показать, что меняют ползунки</span>
        </label>

        <label class="row check">
          <input id="s-skeleton" type="checkbox" checked />
          <span>показывать каркас кружков</span>
        </label>

        <label class="row check">
          <input id="s-grid" type="checkbox" checked />
          <span>сетка 3D</span>
        </label>

        <label class="row check">
          <input id="s-quality" type="checkbox" checked />
          <span>сглаживание 2× (снять = быстрее)</span>
        </label>

        <label class="row check">
          <input id="s-profiler" type="checkbox" />
          <span>профилирование (время кадра)</span>
        </label>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
